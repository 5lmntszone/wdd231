<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore Gear&Ride motorcycles, accessories, and tours." />
  <meta name="author" content="Joanna Wisniewska" />

  <meta property="og:title" content="Gear&Ride | Ride. Learn. Explore.">
  <meta property="og:description" content="Join the Gear&Ride community and explore motorcycles, tours, gear, and more.">
  <meta property="og:image" content="https://5lmntszone.github.io/wdd231/final/images/hero-img.webp">
  <meta property="og:url" content="https://5lmntszone.github.io/wdd231/final/index.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gear&Ride">

  <title>Explore | Gear&Ride</title>

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/explore.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/medium.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap" rel="stylesheet">

  <script src="scripts/explore.js" type="module"></script>
</head>

<body class="explore-page">
  <header>
    <div class="logo">
      <img src="images/logo.webp" alt="Gear&Ride Logo" loading="lazy"/>
      <h1>Gear&Ride</h1>
    </div>
    <nav>
      <button id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html" class="active">Explore</a></li>
        <li><a href="learn.html">Learn</a></li>
      </ul>
    </nav>
  </header>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p><strong>Loading...</strong></p>
  </div>

  <main>
    <section class="explore-header">
      <div class="explore-header-content">
        <h2>Explore Bikes, Accessories & Tours</h2>
        <p>Discover what's available and get ready to ride.</p>

        <div class="filter-controls">
          <label for="category-filter">Filter by category:</label>

          <select id="category-filter">
            <option value="all">All</option>
            <option value="motorcycles">Motorcycles</option>
            <option value="accessories">Accessories</option>
            <option value="tours">Tours</option>
          </select>
        </div>
      </div>

      <div class="image-container">
        <img src="images/explore-img.webp" alt="Motorcycle Image" loading="lazy"/>
      </div>
    </section>

    <section class="explore-container" id="explore-container"></section>

    <div class="modal-overlay hidden" id="modal-overlay">
      <dialog id="modal">
        <button id="closeModal">❌</button>
        <div id="modal-content"></div>
      </dialog>
    </div>
    
  </main>

  <footer>
    <p>WDD231 Final Project | Joanna Wisniewska</p>
    <p>&copy; <span id="year"></span> Gear&Ride</p>
    <p><a href="attributions.html">Attributions</a></p>
    <p><a href="https://youtu.be/Cb_ELEKdY2c" target="_blank" rel="noopener">Project Video - Data, Async JavaScript</a></p>
    <p>Last modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
