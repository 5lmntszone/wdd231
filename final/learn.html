<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Motorcycle education courses and workshops." />
  <meta name="author" content="Joanna Wisniewska" />
  <title>Learn | Gear&Ride</title>

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/learn.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/medium.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap" rel="stylesheet">

  <script src="scripts/learn.js" type="module" defer></script>
</head>
<body class="learn-page">
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Gear&Ride Logo" />
      <h1>Gear&Ride</h1>
    </div>
    <nav>
      <button id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="learn.html" class="active">Learn</a></li>
      </ul>
    </nav>
  </header>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p><strong>Loading...</strong></p>
  </div>

  <main>
    <section class="learn-header">
      <div class="learn-header-content">
        <h2>Learn with the Best</h2>
        <p>Explore workshops and classes led by motorcycle experts.</p>
      </div>
      <img src="images/Body.png" alt="Motorcycle Learn Image" />
    </section>

    <section class="course-controls">
      <p id="credit-display">Total Credits: 0</p>
    </section>

    <section class="course-container" id="course-container"></section>

    <div class="modal-overlay hidden" id="modal-overlay">
      <dialog id="modal">
        <button id="closeModal">❌</button>
        <div id="modal-content"></div>
      </dialog>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Gear&Ride. All rights reserved.</p>
    <p>Last modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
